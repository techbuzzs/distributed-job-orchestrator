<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive distributed job orchestration demo."><title>Flowforge — Job Orchestrator</title><style>:root{--bg:#090b14;--panel:#111727;--ink:#f0f4ff;--muted:#98a5be;--lime:#c5ff5c;--line:#27324b;--warn:#ffbd59;--bad:#ff6b7d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(125deg,#111b35,#090b14 55%);color:var(--ink);font:15px/1.45 Inter,system-ui}.app{max-width:1200px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.top b{letter-spacing:-.04em;font-size:1.2rem}.top b i{font-style:normal;color:var(--lime)}.online{color:var(--lime);font-size:.8rem}.hero{display:flex;justify-content:space-between;gap:30px;align-items:end;padding:46px 0 27px}.hero h1{font-size:clamp(2.4rem,5vw,4rem);line-height:1;margin:0;letter-spacing:-.06em}.hero p{color:var(--muted);max-width:530px}.button{background:var(--lime);border:0;border-radius:8px;padding:11px 15px;color:#111807;font-weight:800;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.board{background:#0e1422d9;border:1px solid var(--line);border-radius:12px;padding:17px}.stat small{color:var(--muted)}.stat strong{font-size:1.7rem;display:block;margin-top:4px}.board{margin-top:18px}.board h2{font-size:1rem;margin:0 0 15px}.jobs{display:grid;gap:8px}.job{display:grid;grid-template-columns:1.2fr .6fr .6fr .8fr;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0}.job small{color:var(--muted)}.badge{border:1px solid var(--line);border-radius:99px;padding:4px 7px;font-size:.75rem;text-align:center}.queued{color:var(--warn)}.running{color:var(--lime)}.retry{color:var(--bad)}.workers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.worker{border:1px solid var(--line);border-radius:10px;padding:15px}.bar{height:6px;background:#233149;border-radius:9px;margin-top:10px;overflow:hidden}.bar i{height:100%;display:block;background:var(--lime);border-radius:9px;transition:width .3s}@media(max-width:700px){.hero{display:block}.hero .button{margin-top:12px}.stats{grid-template-columns:1fr 1fr}.job{grid-template-columns:1fr 1fr}.workers{grid-template-columns:1fr}}</style><link rel="stylesheet" href="theme.css"><script src="theme.js"></script></head><body><main class="app"><header class="top"><b>FLOW<i>FORGE</i></b><span class="online">● Workers healthy</span></header><section class="hero"><div><h1>Jobs, moving<br>with purpose.</h1><p>Interactive orchestration dashboard with browser-side workers, retries, and delivery status simulation.</p></div><button class="button" id="run">Run next cycle</button></section><section class="stats"><div class="stat"><small>Processed today</small><strong id="processed">2,841</strong></div><div class="stat"><small>Queue depth</small><strong id="depth">14</strong></div><div class="stat"><small>Success rate</small><strong>99.2%</strong></div><div class="stat"><small>Median latency</small><strong>178ms</strong></div></section><section class="board"><h2>Live job queue</h2><div class="jobs" id="jobs"></div></section><section class="workers" id="workers"></section></main><script>const names=['Invoice reconciliation','Search index refresh','Export customer ledger','Notify approval chain','Sync warehouse feed'];let jobs=names.map((n,i)=>({n,id:'job_'+(3841+i),s:i===2?'Retrying':i<2?'Running':'Queued',a:i+1}));let processed=2841,depth=14;const draw=()=>{document.querySelector('#jobs').innerHTML=jobs.map(j=>`<div class="job"><div><b>${j.n}</b><br><small>${j.id}</small></div><div><small>Attempt ${j.a}</small></div><div class="badge ${j.s.toLowerCase().replace(' ','')}">${j.s}</div><div><small>${j.s==='Running'?'worker-'+j.a:'waiting'}</small></div></div>`).join('');document.querySelector('#processed').textContent=processed.toLocaleString();document.querySelector('#depth').textContent=depth;document.querySelector('#workers').innerHTML=[63,38,82].map((x,i)=>`<div class="worker"><b>worker-${i+1}</b><br><small>${x<70?'Processing jobs':'Near capacity'}</small><div class="bar"><i style="width:${x}%"></i></div></div>`).join('')};document.querySelector('#run').onclick=()=>{let next=jobs.shift();processed++;depth=Math.max(0,depth-1);jobs.forEach((j,i)=>j.s=i===0?'Running':'Queued');jobs.push({n:next.n,id:'job_'+Math.floor(4000+Math.random()*900),s:'Queued',a:1});draw()};draw()</script></body></html>
